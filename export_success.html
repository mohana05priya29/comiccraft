<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Export Successful - ComicCraft</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff4e6, #f8e8ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .success-container {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 45px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .success-icon {
            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 50%;
            background: #e8f8ed;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        h1 {
            margin-top: 25px;
            font-size: 32px;
            color: #333;
        }

        .message {
            margin-top: 15px;
            color: #666;
            font-size: 17px;
            line-height: 1.6;
        }

        .file-box {
            margin-top: 30px;
            padding: 20px;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 15px;
        }

        .file-name {
            font-size: 18px;
            font-weight: bold;
            color: #444;
            word-break: break-word;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button,
        a {
            padding: 13px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .download-btn {
            background: #6c5ce7;
            color: white;
        }

        .download-btn:hover {
            background: #5848d6;
        }

        .home-btn {
            background: #eeeeee;
            color: #333;
        }

        .home-btn:hover {
            background: #dddddd;
        }

        .preview-btn {
            background: #ff9f43;
            color: white;
        }

        .preview-btn:hover {
            background: #f38b20;
        }

        .info {
            margin-top: 30px;
            font-size: 14px;
            color: #888;
        }

        @media (max-width: 600px) {
            .success-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 26px;
            }

            .message {
                font-size: 15px;
            }

            .buttons {
                flex-direction: column;
            }

            button,
            a {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="success-container">

        <div class="success-icon">
            ✓
        </div>

        <h1>Export Successful! 🎉</h1>

        <p class="message">
            Your ComicCraft comic has been successfully exported.
            Your comic is ready to download and share.
        </p>

        <div class="file-box">

            <p>Exported File</p>

            <p class="file-name" id="fileName">
                comiccraft_comic.pdf
            </p>

        </div>

        <div class="buttons">

            <button
                class="download-btn"
                onclick="downloadComic()">
                ⬇ Download Comic
            </button>

            <a
                href="/comic-preview"
                class="preview-btn">
                👀 View Comic
            </a>

            <a
                href="/"
                class="home-btn">
                🏠 Back to Home
            </a>

        </div>

        <p class="info">
            Thank you for creating your story with ComicCraft ❤️
        </p>

    </div>


    <script>

        // Get exported file information
        const params = new URLSearchParams(window.location.search);

        const file = params.get("file");

        if (file) {
            document.getElementById("fileName").textContent = file;
        }


        // Download exported comic
        function downloadComic() {

            const fileName = file || "comiccraft_comic.pdf";

            const downloadUrl =
                "/exports/" + encodeURIComponent(fileName);

            const link = document.createElement("a");

            link.href = downloadUrl;
            link.download = fileName;

            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);
        }

    </script>

</body>
</html>
